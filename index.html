<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIsary</title>
<meta name="description" content="AIsary par Toky Rakotomalala : composez vos images IA comme sur un vrai plateau photo. Logiciel libre créé à Madagascar.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;800&display=swap">
<link rel="stylesheet" href="css/aisary.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <header>
    <button class="logo" id="aboutBtn" aria-label="À propos d'AIsary"><span id="brandSlot"></span></button>
    <button class="btn ghost needproj" id="homeBtn" hidden><i data-lucide="house" class="ic"></i><span>Accueil</span></button>
    <span class="ptbadge2 needproj" id="ptBadge" hidden></span>
    <input type="text" id="projName" class="projname needproj" aria-label="Nom du projet" hidden>
    <button class="btn ghost needproj savebtn" id="saveBtn" hidden title="Enregistrer le projet"><i data-lucide="save" class="ic"></i><span>Enregistrer</span><small id="saveState" data-state="ok"></small></button>
    <div class="sp"></div>
    <button class="btn upbtn" id="upBtn" title="Agrandir une image pour l'impression"><i data-lucide="maximize" class="ic"></i><span>Upscale</span></button>
    <div class="modesw" id="modeSwitch" role="group" aria-label="Mode de génération"></div>
    <button class="btn primary needproj" id="exportBtn" hidden><i data-lucide="send" class="ic"></i><span>Exporter</span></button>
    <button class="btn ghost iconly" id="aboutBtn2" onclick="document.getElementById('aboutBtn').click()" aria-label="À propos"><i data-lucide="info" class="ic"></i></button>
  </header>
  <section id="home" aria-label="Accueil"></section>
  <main id="editor" hidden>
    <section class="col" aria-label="Réglages de la scène">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="panel" id="panel"></div>
    </section>

    <section class="col" aria-label="Plateau">
      <div class="stagehd">
        <h2>Plateau</h2>
        <span class="vlegend"><b>Z</b> dessus · <b>X</b> face · <b>Y</b> côté</span>
        <div class="sp"></div>
        <div class="addwrap"><button class="btn small" id="addLightBtn" aria-haspopup="true"><i data-lucide="lightbulb" class="ic"></i><span>+ Lumière</span></button><div id="addmenu" hidden></div></div>
        <span class="hintbar"><i data-lucide="mouse-pointer-click" class="ic"></i>Glissez pour placer · cliquez pour régler</span>
      </div>
      <div id="stagewrap">
        <svg id="vz" data-view="z" viewBox="0 0 100 100" aria-label="Vue de dessus du plateau"></svg>
        <svg id="vx" data-view="x" viewBox="0 0 100 60" aria-label="Vue de face du plateau"></svg>
        <svg id="vy" data-view="y" viewBox="0 0 100 60" aria-label="Vue de côté du plateau"></svg>
        <div id="pop" hidden></div>
      </div>
      <div class="readout" id="readout"></div>
    </section>

    <section class="col" aria-label="Viseur et prompt">
      <div class="out">
        <h2><i data-lucide="scan" class="ic"></i>Viseur <small>Aperçu indicatif de la composition</small></h2>
        <div class="finderbox"><svg id="finder" viewBox="0 0 100 125" aria-label="Aperçu du cadrage"></svg><div id="finderCap"></div></div>
        <h2><i data-lucide="text-cursor-input" class="ic"></i>Prompt généré</h2>
        <div id="prompt"></div>
      </div>
    </section>
  </main>
  <section id="export" aria-label="Export" hidden></section>
  <section id="upscale" aria-label="Upscale" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>
<div id="win" hidden></div>
<div id="turbo" hidden></div>
<div id="overlay" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/data.js"></script>
<script src="js/mada.js"></script>
<script src="js/data2.js"></script>
<script src="js/store.js"></script>
<script src="js/poses.js"></script>
<script src="js/poses2.js"></script>
<script src="js/app.js"></script>
<script src="js/panel.js"></script>
<script src="js/brand.js"></script>
<script src="js/home.js"></script>
<script src="js/export.js"></script>
<script src="js/turbo.js"></script>
<script src="js/upscale.js"></script>
<script src="js/guide.js"></script>
<script src="js/desktop.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
