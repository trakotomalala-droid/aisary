# Fabrique les applications AIsary pour Mac et Windows et les publie dans « Releases ».
# Se lance quand la version change dans src-tauri/tauri.conf.json, quand on pousse un tag (ex. v0.5.0),
# ou à la main depuis l'onglet Actions (« Run workflow »).
name: Applications Mac et Windows

on:
  push:
    branches: [main]
    paths: ['src-tauri/tauri.conf.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Installer l'outil Tauri
        run: npm install

      - name: Préparer l'interface hors connexion
        shell: bash
        run: bash scripts/prepare-dist.sh

      - name: Générer les icônes
        run: npx tauri icon app-icon.png

      - name: Fabriquer et publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: AIsary v__VERSION__
          releaseBody: |
            **AIsary par Toky Rakotomalala**, logiciel libre créé à Madagascar.

            ### Télécharger
            - **Mac** (Intel et Apple Silicon) : fichier `.dmg`
            - **Windows** : fichier `-setup.exe` (recommandé) ou `.msi`

            ### Première ouverture sur Mac
            L'application n'est pas encore signée par Apple. Au premier lancement :
            faites un clic droit sur AIsary dans Applications, puis « Ouvrir », et confirmez.
            Si macOS indique que l'application est endommagée, ouvrez le Terminal et tapez :
            `xattr -cr /Applications/AIsary.app`

            ### Première ouverture sur Windows
            Si Windows affiche « Windows a protégé votre ordinateur », cliquez sur « Informations complémentaires » puis « Exécuter quand même ».
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
